name: Validate IntuneAccess

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install validation dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph.Authentication -MinimumVersion 2.0.0 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 6.0.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -MinimumVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Microsoft.PowerShell.PSResourceGet -MinimumVersion 1.2.0 -Scope CurrentUser -Force

      - name: Run release validation
        shell: pwsh
        run: ./tools/Test-Release.ps1

      - name: Build and test Gallery package
        shell: pwsh
        run: |
          $package = ./tools/New-IntuneAccessGalleryPackage.ps1 -Force
          ./tools/Test-IntuneAccessGalleryPackage.ps1 -PackagePath $package.Package

      - name: Generate synthetic demonstration report
        shell: pwsh
        run: |
          $result = ./tools/New-IntuneAccessDemo.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'demo-site')
          if ($result.ManagedDevices -lt 1 -or $result.RoleAssignments -lt 1) { throw 'The demonstration report did not exercise the collection pipeline.' }
